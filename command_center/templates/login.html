<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PureHub Command Center Login</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: #f8fafc;
        background:
          radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.14), transparent 34rem),
          #020617;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem 1rem;
      }

      .login-card {
        width: min(100%, 30rem);
        padding: clamp(1.5rem, 5vw, 2.25rem);
        overflow: hidden;
        border: 1px solid rgba(52, 211, 153, 0.16);
        border-radius: 2rem;
        background:
          linear-gradient(145deg, rgba(30, 41, 59, 0.96), rgba(2, 6, 23, 0.98));
        box-shadow:
          0 2rem 6rem -3rem rgba(16, 185, 129, 0.55),
          0 1rem 3rem -2rem rgba(0, 0, 0, 0.85);
        animation: enter 300ms ease-out both;
      }

      .eyebrow {
        margin: 0;
        color: #6ee7b7;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.22em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.65rem 0 0;
        color: #fff;
        font-size: clamp(1.85rem, 7vw, 2.25rem);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }

      .intro {
        margin: 0.85rem 0 0;
        color: #cbd5e1;
        font-size: 0.925rem;
        line-height: 1.7;
      }

      .message {
        margin-top: 1.25rem;
        padding: 0.85rem 1rem;
        border: 1px solid rgba(253, 164, 175, 0.2);
        border-radius: 1rem;
        color: #ffe4e6;
        background: rgba(244, 63, 94, 0.1);
        font-size: 0.875rem;
      }

      form {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      label,
      label span {
        display: block;
      }

      label span {
        margin: 0 0 0.5rem 0.2rem;
        color: #e2e8f0;
        font-size: 0.875rem;
        font-weight: 650;
      }

      input {
        width: 100%;
        min-height: 3.25rem;
        padding: 0.8rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1rem;
        outline: none;
        color: #fff;
        background: rgba(255, 255, 255, 0.055);
        font: inherit;
        transition:
          border-color 160ms ease,
          background-color 160ms ease,
          box-shadow 160ms ease;
      }

      input:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }

      input:focus {
        border-color: rgba(52, 211, 153, 0.7);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
      }

      button {
        min-height: 3.25rem;
        margin-top: 0.25rem;
        border: 1px solid rgba(52, 211, 153, 0.32);
        border-radius: 1rem;
        color: #d1fae5;
        background: rgba(16, 185, 129, 0.17);
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background-color 160ms ease;
      }

      button:hover {
        border-color: rgba(52, 211, 153, 0.5);
        background: rgba(16, 185, 129, 0.24);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      button:focus-visible {
        outline: 3px solid rgba(52, 211, 153, 0.35);
        outline-offset: 3px;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(0.75rem) scale(0.99);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">PureHub Command Center</p>
        <h1 id="login-title">Welcome back</h1>
        <p class="intro">
          Sign in to manage releases, community publishing, credentials, and mini-app controls.
        </p>

        {% if message %}
        <div class="message" role="alert">{{ message }}</div>
        {% endif %}

        <form action="{{ admin_prefix }}/login" method="post">
          <label>
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" required autofocus />
          </label>

          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>

          <button type="submit">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
