<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PureHub Command Center Login</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: #0f172a;
        background:
          radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12), transparent 34rem),
          #f4f7fb;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem 1rem;
      }

      .login-card {
        width: min(100%, 30rem);
        padding: clamp(1.5rem, 5vw, 2.25rem);
        overflow: hidden;
        border: 1px solid #e2e8f0;
        border-radius: 1.5rem;
        background: #ffffff;
        box-shadow:
          0 2rem 6rem -3rem rgba(16, 185, 129, 0.22),
          0 1rem 3rem -2rem rgba(15, 23, 42, 0.22);
        animation: enter 300ms ease-out both;
      }

      .eyebrow {
        margin: 0;
        color: #059669;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.22em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.65rem 0 0;
        color: #0f172a;
        font-size: clamp(1.85rem, 7vw, 2.25rem);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }

      .intro {
        margin: 0.85rem 0 0;
        color: #475569;
        font-weight: 520;
        font-size: 0.925rem;
        line-height: 1.7;
      }

      .message {
        margin-top: 1.25rem;
        padding: 0.85rem 1rem;
        border: 1px solid rgba(253, 164, 175, 0.2);
        border-radius: 1rem;
        color: #be123c;
        background: #fff1f2;
        font-size: 0.875rem;
      }

      form {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      label,
      label span {
        display: block;
      }

      label span {
        margin: 0 0 0.5rem 0.2rem;
        color: #334155;
        font-size: 0.875rem;
        font-weight: 650;
      }

      input {
        width: 100%;
        min-height: 2.8rem;
        padding: 0.65rem 0.8rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.75rem;
        outline: none;
        color: #0f172a;
        background: #ffffff;
        font-weight: 550;
        font: inherit;
        transition:
          border-color 160ms ease,
          background-color 160ms ease,
          box-shadow 160ms ease;
      }

      input:hover {
        border-color: #cbd5e1;
      }

      input:focus {
        border-color: rgba(52, 211, 153, 0.7);
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
      }

      button {
        min-height: 2.8rem;
        margin-top: 0.25rem;
        border: 1px solid rgba(52, 211, 153, 0.32);
        border-radius: 0.75rem;
        color: #ffffff;
        background: #059669;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background-color 160ms ease;
      }

      button:hover {
        border-color: rgba(52, 211, 153, 0.5);
        background: #047857;
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      button:focus-visible {
        outline: 3px solid rgba(52, 211, 153, 0.35);
        outline-offset: 3px;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(0.75rem) scale(0.99);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">PureHub Command Center</p>
        <h1 id="login-title">Welcome back</h1>
        <p class="intro">
          Sign in to manage releases, community publishing, credentials, and mini-app controls.
        </p>

        {% if message %}
        <div class="message" role="alert">{{ message }}</div>
        {% endif %}

        <form action="{{ admin_prefix }}/login" method="post">
          <label>
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" required autofocus />
          </label>

          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>

          <button type="submit">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
