name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Configure Gradle memory
        shell: bash
        run: |
          mkdir -p "${HOME}/.gradle"
          cat >> "${HOME}/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          EOF
      - name: Run Android unit tests
        run: ./gradlew --no-daemon testStandardDebugUnitTest --stacktrace
      - name: Run Android lint
        run: ./gradlew --no-daemon lintStandardDebug --stacktrace
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleStandardDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: purehub-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
