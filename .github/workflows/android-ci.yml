name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Enforce offline-only APK
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          PERMISSIONS="$("${AAPT}" dump permissions app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "${PERMISSIONS}"
          if grep -q 'android.permission.INTERNET' <<<"${PERMISSIONS}"; then
            echo "::error::Offline-only privacy gate failed: APK requests android.permission.INTERNET"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: purehub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
