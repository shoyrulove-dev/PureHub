name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testStandardDebugUnitTest testFdroidDebugUnitTest lintStandardDebug lintFdroidDebug assembleStandardDebug assembleFdroidDebug --stacktrace
      - name: Enforce FLOSS-only F-Droid dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew app:dependencies --configuration fdroidReleaseRuntimeClasspath > fdroid-dependencies.txt
          if grep -E 'com\.google\.android\.gms|com\.google\.mlkit|com\.google\.firebase' fdroid-dependencies.txt; then
            echo "::error::F-Droid flavor contains a prohibited Google dependency"
            exit 1
          fi
      - name: Enforce offline-only APK
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          PERMISSIONS="$("${AAPT}" dump permissions app/build/outputs/apk/fdroid/debug/app-fdroid-universal-debug.apk)"
          printf '%s\n' "${PERMISSIONS}"
          if grep -q 'android.permission.INTERNET' <<<"${PERMISSIONS}"; then
            echo "::error::Offline-only privacy gate failed: APK requests android.permission.INTERNET"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: purehub-debug-apk
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
