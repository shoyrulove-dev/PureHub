name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - "vercel.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "pwa/**"
      - "vercel.json"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
        working-directory: pwa
      - run: npm run lint
        working-directory: pwa
      - run: npm run build
        working-directory: pwa
