name: Web and Command Center CI

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - "command_center/**"
      - "api/**"
      - "requirements.txt"
      - "vercel.json"
      - ".github/workflows/web-command-center-ci.yml"
  pull_request:
    paths:
      - "pwa/**"
      - "command_center/**"
      - "api/**"
      - "requirements.txt"
      - "vercel.json"
      - ".github/workflows/web-command-center-ci.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
        working-directory: pwa
      - run: npm run lint
        working-directory: pwa
      - run: npm run build
        working-directory: pwa

  command-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q command_center api
      - name: Parse admin template
        run: |
          python - <<'PY'
          from command_center.main import templates
          templates.env.get_template("index.html")
          print("Admin template parsed successfully.")
          PY
